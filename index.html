  function computeListData() {
    var result = { items: [], isEmpty: false, emptyMessage: "", emptyIsFilterCause: false, showFilterBar: false };
    if (!(state.screen === "list" && state.category && state.county)) { return result; }
    var baseMatches = ALL_RESOURCES.filter(function (r) {
      return r.counties.indexOf(state.county) !== -1 && r.categories.indexOf(state.category) !== -1;
    });
    result.showFilterBar = baseMatches.length > 0;
    var matches = baseMatches.filter(function (r) {
      var genderOk = !state.filterGender || !r.genderServed || r.genderServed === state.filterGender;
      var ageOk = !state.filterAge || !r.ageRequirement || r.ageRequirement === state.filterAge;
      var sexOk = !state.filterHideSexOffense || !r.excludesSexOffenses;
      return genderOk && ageOk && sexOk;
    });
    matches.sort(function (a, b) {
      if (a.priority !== b.priority) { return a.priority ? -1 : 1; }
      return a.name.localeCompare(b.name);
    });
    result.items = matches.map(function (r) { return buildItemData(r, "list"); });
    result.isEmpty = result.items.length === 0;
    if (result.isEmpty) {
      if (baseMatches.length > 0) {
        result.emptyIsFilterCause = true;
        result.emptyMessage = "No resources match these filters in " + state.county + " County. Try clearing a filter.";
      } else {
        result.emptyMessage = "We don't have a listed resource for this yet in " + state.county + " County. Try another category, or call 211 for help finding local support.";
      }
    }
    return result;
  }

  function computeSavedGroups() {
    var groups = [];
    CATEGORY_ORDER.forEach(function (cat) {
      var items = ALL_RESOURCES.filter(function (r) {
        return r.categories[0] === cat && isSaved(r.id);
      }).map(function (r) { return buildItemData(r, "saved"); });
      if (items.length > 0) { groups.push({ key: cat, label: cat, items: items }); }
    });
    return groups;
  }

  function computeDetail() {
    if (!(state.screen === "detail" && state.resourceId)) { return null; }
    var found = ALL_RESOURCES.filter(function (x) { return x.id === state.resourceId; })[0];
    if (!found) { return null; }
    var saved = isSaved(found.id);
    var ctxCategory = state.category || found.categories[0];
    var ctxCounty = state.county || found.counties[0];
    return {
      name: found.name,
      phone: found.phone || "",
      telHref: found.telHref || "",
      refers: !!found.turn90Refers,
      hasPhone: !!found.telHref && !found.turn90Refers,
      website: found.website || "",
      hasWebsite: !!found.website && !found.turn90Refers,
      address: found.address || "",
      hasAddress: !!found.address,
      hours: found.hours || "",
      hasHours: !!found.hours,
      description: found.fullDescription,
      categoryLabel: ctxCategory,
      countyLabel: ctxCounty + " County",
      costLabel: found.costLabel || "",
      hasCost: !!found.costLabel,
      accessMethods: found.showAccessMethods ? found.accessMethods : [],
      hasAccess: found.showAccessMethods && found.accessMethods.length > 0,
      documents: found.documents,
      hasDocuments: found.documents.length > 0,
      eligibilityNotes: found.eligibilityNotes,
      hasEligibility: found.eligibilityNotes.length > 0,
      id: found.id,
      saved: saved
    };
  }

        '<span><span style="display:block;font-size:15px;font-weight:700;color:#2A2118;line-height:1.25;">' + t.label + '</span>' +
        '<span style="display:block;font-size:12.5px;color:#8A7A68;margin-top:3px;line-height:1.3;">' + t.sub + '</span></span></button>';
    }).join("");
    return (
      '<div style="padding:20px 20px 28px 20px;">' +
      '<p style="margin:0 0 6px 0;font-size:14px;font-weight:700;color:#1C566E;text-transform:uppercase;letter-spacing:0.04em;">' + esc(ctx) + '</p>' +
      '<p style="margin:0 0 18px 0;font-size:15px;color:#5B4B3B;">What kind of help do you need?</p>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' + tiles + '</div>' +
      '</div>'
    );
  }

  function segStyle(active) {
    return active
      ? "background:#1C566E;color:#FFFFFF;border:1px solid #1C566E;"
      : "background:#FFFFFF;color:#2A2118;border:1px solid #E7DDCE;";
  }

  function renderFilterBar(listData) {
    if (!listData.showFilterBar) { return ""; }
    var activeCount = (state.filterGender ? 1 : 0) + (state.filterAge ? 1 : 0) + (state.filterHideSexOffense ? 1 : 0);
    var hasActive = activeCount > 0;
    var badge = hasActive
      ? '<span style="margin-left:4px;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#1C566E;color:#FFFFFF;font-size:12px;font-weight:700;">' + activeCount + "</span>"
      : "";
    var panel = "";
    if (state.showFilters) {
      var checkBg = state.filterHideSexOffense ? "#1C566E" : "#FFFFFF";
      var checkBorder = state.filterHideSexOffense ? "#1C566E" : "#E7DDCE";
      var checkMark = state.filterHideSexOffense
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"/></svg>'
        : "";
      var clearBtn = hasActive
        ? '<button data-action="clearFilters" style="margin-top:12px;width:100%;height:40px;border-radius:10px;border:1px solid #E7DDCE;background:#FBF6EE;color:#1C566E;font-size:13px;font-weight:700;cursor:pointer;">Clear Filters</button>'
        : "";
      panel =
        '<div style="margin-top:10px;padding:16px;border-radius:14px;border:1px solid #E7DDCE;background:#FFFFFF;">' +
        '<p style="margin:0 0 8px 0;font-size:13px;font-weight:700;color:#2A2118;">Who is this for?</p>' +
        '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
        '<button data-action="setGenderFilter" data-value="" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;' + segStyle(!state.filterGender) + '">Anyone</button>' +
        '<button data-action="setGenderFilter" data-value="male" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;' + segStyle(state.filterGender === "male") + '">Men</button>' +
        '<button data-action="setGenderFilter" data-value="female" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;' + segStyle(state.filterGender === "female") + '">Women</button>' +
        '</div>' +
        '<p style="margin:0 0 8px 0;font-size:13px;font-weight:700;color:#2A2118;">Age</p>' +
        '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
        '<button data-action="setAgeFilter" data-value="" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;' + segStyle(!state.filterAge) + '">Any age</button>' +
        '<button data-action="setAgeFilter" data-value="adults" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;' + segStyle(state.filterAge === "adults") + '">18 and up</button>' +
        '<button data-action="setAgeFilter" data-value="young_adults" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;' + segStyle(state.filterAge === "young_adults") + '">18–24</button>' +
        '</div>' +
        '<button data-action="toggleHideSexOffense" style="width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:8px 2px;border:none;background:none;cursor:pointer;text-align:left;">' +
        '<span style="width:22px;height:22px;flex-shrink:0;border-radius:6px;border:2px solid ' + checkBorder + ';background:' + checkBg + ';display:flex;align-items:center;justify-content:center;">' + checkMark + '</span>' +
        '<span style="font-size:14px;color:#2A2118;line-height:1.35;">Only show places open to sex-offense convictions</span>' +
        '</button>' +
        clearBtn +
        '</div>';
    }
    return (
      '<div style="padding:0 16px 16px 16px;">' +
      '<button data-action="toggleFilters" style="box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid #E7DDCE;background:#FFFFFF;cursor:pointer;">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C566E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.5V18l-3 1.5v-7L4 5z"/></svg>' +
      '<span style="font-size:14px;font-weight:700;color:#2A2118;">' + (state.showFilters ? "Hide Filters" : "Filters") + '</span>' + badge +
      '</button>' + panel + '</div>'
    );
  }

  function renderList() {
    var listData = computeListData();
    var listContext = state.county ? ("In " + state.county + " County") : "";
    var out = '<div style="padding:16px 0 24px 0;">';
    out += '<p style="margin:4px 16px 16px 16px;font-size:14px;font-weight:700;color:#1C566E;text-transform:uppercase;letter-spacing:0.04em;">' + esc(listContext) + '</p>';
    out += renderFilterBar(listData);
    if (listData.isEmpty) {
      var btn = listData.emptyIsFilterCause
        ? '<button data-action="clearFilters" style="height:56px;padding:0 28px;border-radius:14px;border:none;background:#1C566E;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer;">Clear Filters</button>'
        : '<button data-action="backToCategory" style="height:56px;padding:0 28px;border-radius:14px;border:none;background:#1C566E;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer;">Try Another Category</button>';
      out += '<div style="padding:8px 28px 32px 28px;text-align:center;"><p style="margin:0 0 20px 0;font-size:16px;line-height:1.5;color:#5B4B3B;">' + esc(listData.emptyMessage) + '</p>' + btn + '</div>';
    }
    out += listData.items.map(renderCardHtml).join("");
    out += '</div>';
    return out;
  }

  function renderDetail() {
    var d = computeDetail();
    if (!d) { return '<div style="padding:40px 28px;text-align:center;"><p style="font-size:16px;color:#5B4B3B;">We couldn\'t find that resource.</p></div>'; }
    var out = '<div style="padding:24px 20px 32px 20px;">';
    out += '<p style="margin:0 0 6px 0;font-size:13px;font-weight:700;color:#1C566E;text-transform:uppercase;letter-spacing:0.04em;">' + esc(d.categoryLabel) + ' · ' + esc(d.countyLabel) + '</p>';
    out += '<h2 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;font-weight:800;color:#2A2118;">' + esc(d.name) + '</h2>';
    if (d.hasCost) {
      out += '<span style="display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:#E1ECEF;color:#1C566E;font-size:13px;font-weight:700;">' + esc(d.costLabel) + '</span>';
    }
    out += '<p style="margin:0 0 24px 0;font-size:15px;line-height:1.55;color:#5B4B3B;">' + esc(d.description) + '</p>';
    if (d.refers) {
      out += '<div style="margin:0 0 14px 0;padding:14px 16px;border-radius:12px;background:#E1ECEF;border:1px solid #C5D9DF;"><p style="margin:0 0 4px 0;font-size:14px;font-weight:700;color:#1C566E;">Referral through Turn90</p><p style="margin:0;font-size:14px;line-height:1.5;color:#2A2118;">This program takes referrals through Turn90 instead of directly from individuals. Call us and we will help get you connected.</p></div>';
      out += '<a href="' + TURN90_TEL + '" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;background:#1C566E;color:#FFFFFF;border-radius:14px;text-decoration:none;font-weight:700;font-size:17px;margin-bottom:20px;">' + CALL_ICON.replace('width="17" height="17"', 'width="20" height="20"') + '<span>Call (843) 297-4980 ext. 1</span></a>';
    }
    if (d.hasPhone) {
      out += '<a href="' + esc(d.telHref) + '" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;background:#1C566E;color:#FFFFFF;border-radius:14px;text-decoration:none;font-weight:700;font-size:17px;margin-bottom:12px;">' + CALL_ICON.replace('width="17" height="17"', 'width="20" height="20"') + '<span>Call ' + esc(d.phone) + '</span></a>';
    }
    if (d.hasWebsite) {
      out += '<a href="' + esc(d.website) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;background:#FFFFFF;color:#1C566E;border:2px solid #1C566E;border-radius:14px;text-decoration:none;font-weight:700;font-size:16px;margin-bottom:20px;"><span>Visit Website</span></a>';
    }
    if (d.hasAddress) {
      out += '<div style="display:flex;align-items:flex-start;gap:10px;padding:14px 0;border-top:1px solid #E7DDCE;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7A68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;flex-shrink:0;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span style="font-size:15px;color:#2A2118;line-height:1.5;">' + esc(d.address) + '</span></div>';
    }
    if (d.hasHours) {
      out += '<div style="display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid #E7DDCE;">' + CLOCK_ICON.replace('width="15" height="15"', 'width="18" height="18"') + '<span style="font-size:15px;color:#2A2118;">' + esc(d.hours) + '</span></div>';
    }
    if (d.hasAccess) {
      out += '<div style="padding:14px 0;border-top:1px solid #E7DDCE;"><p style="margin:0 0 8px 0;font-size:13px;font-weight:700;color:#2A2118;">How to Connect</p>' +
        d.accessMethods.map(function (am) { return '<p style="margin:0 0 4px 0;font-size:14px;color:#5B4B3B;line-height:1.4;">• ' + esc(am) + '</p>'; }).join("") + '</div>';
    }
    if (d.hasDocuments) {
      out += '<div style="padding:14px 0;border-top:1px solid #E7DDCE;"><p style="margin:0 0 8px 0;font-size:13px;font-weight:700;color:#2A2118;">What to Bring</p>' +
        d.documents.map(function (doc) { return '<p style="margin:0 0 4px 0;font-size:14px;color:#5B4B3B;line-height:1.4;">• ' + esc(doc) + '</p>'; }).join("") + '</div>';
    }
    if (d.hasEligibility) {
      out += '<div style="padding:14px 0;border-top:1px solid #E7DDCE;"><p style="margin:0 0 8px 0;font-size:13px;font-weight:700;color:#2A2118;">Good to Know</p>' +
        d.eligibilityNotes.map(function (note) { return '<p style="margin:0 0 4px 0;font-size:14px;color:#5B4B3B;line-height:1.4;">• ' + esc(note) + '</p>'; }).join("") + '</div>';
    }
    var saveBg = d.saved ? "#E4EEE2" : "#1C566E";
    var saveColor = d.saved ? "#2F4A34" : "#FFFFFF";
    var saveBorder = d.saved ? "1px solid #B9D2BC" : "1px solid #1C566E";
    var saveLabel = d.saved ? "Saved — tap to remove" : "Save this resource";
    out += '<button data-action="toggleSave" data-id="' + esc(d.id) + '" style="width:100%;height:56px;border-radius:14px;margin-top:24px;font-size:16px;font-weight:700;cursor:pointer;background:' + saveBg + ';color:' + saveColor + ';border:' + saveBorder + ';">' + saveLabel + '</button>';
    out += '</div>';
    return out;
  }

  function renderSaved() {
    var groups = computeSavedGroups();
    var out = '<div style="padding:16px 0 24px 0;">';
    if (groups.length === 0) {
      out += '<div style="padding:40px 28px;text-align:center;"><p style="margin:0 0 20px 0;font-size:16px;line-height:1.5;color:#5B4B3B;">You haven\'t saved anything yet. When you find a resource you want to keep, tap the bookmark icon to add it here.</p><button data-action="goFindResources" style="height:56px;padding:0 28px;border-radius:14px;border:none;background:#1C566E;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer;">Find Resources</button></div>';
    }
    groups.forEach(function (group) {
      out += '<p style="margin:20px 16px 10px 16px;font-size:15px;font-weight:700;color:#2A2118;">' + esc(group.label) + '</p>';
      out += group.items.map(renderCardHtml).join("");
    });
    out += '</div>';
    return out;
  }

  function renderLoading() {
    return '<div style="padding:60px 28px;text-align:center;"><p style="font-size:16px;color:#5B4B3B;">Loading resources…</p></div>';
  }

  function renderLoadError() {
    return '<div style="padding:60px 28px;text-align:center;"><p style="margin:0 0 12px 0;font-size:16px;line-height:1.5;color:#5B4B3B;">We couldn\'t load the resource list. Please check your connection and reload the page.</p><button data-action="reloadData" style="height:48px;padding:0 24px;border-radius:12px;border:none;background:#1C566E;color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;">Try Again</button></div>';
  }

  var SCREEN_TITLES = {
    county: "Pick a County",
    category: "Find Resources",
    detail: "Resource Details",
    saved: "Saved Resources",
    programs: "Turn90 Programs"
  };

  function render() {
    var contentEl = document.getElementById("content");
    var topbarEl = document.getElementById("topbar");

    if (state.dataStatus === "loading") {
      contentEl.innerHTML = renderLoading();
      topbarEl.hidden = true;
      return;
    }
    if (state.dataStatus === "error") {
      contentEl.innerHTML = renderLoadError();
      topbarEl.hidden = true;
      return;
    }

    var showTopBar = state.screen !== "landing";
    topbarEl.hidden = !showTopBar;
    if (showTopBar) {
      var title = state.screen === "list" ? (state.category || "") : (SCREEN_TITLES[state.screen] || "");
      topbarEl.innerHTML =
        '<button aria-label="Go back" data-action="back" style="width:44px;height:44px;flex-shrink:0;border-radius:12px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">' +
        '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#2A2118" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<h1 style="margin:0;font-size:19px;font-weight:700;color:#2A2118;">' + esc(title) + '</h1>';
    }

    var html;
    switch (state.screen) {
      case "county": html = renderCounty(); break;
      case "category": html = renderCategory(); break;
      case "list": html = renderList(); break;
      case "detail": html = renderDetail(); break;
      case "saved": html = renderSaved(); break;
      case "programs": html = renderPrograms(); break;
      default: html = renderLanding();
    }
    contentEl.innerHTML = html;
    restoreZipFocus();
  }

  // ---------------------------------------------------------------------
  // ZIP input focus/cursor preservation across re-renders
  // ---------------------------------------------------------------------
  var zipHadFocus = false;
  function restoreZipFocus() {
    if (!zipHadFocus) { return; }
    var el = document.getElementById("turn90-zip");
    if (el) {
      el.focus();
      var pos = el.value.length;
      try { el.setSelectionRange(pos, pos); } catch (e) {}
    }
  }

  // ---------------------------------------------------------------------
  // Event delegation
  // ---------------------------------------------------------------------
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) { return; }
    var action = el.getAttribute("data-action");
    switch (action) {
      case "goFindResources": goFindResources(); break;
      case "goSaved": goSaved(); break;
      case "goPrograms": goPrograms(); break;
      case "back": back(); break;
      case "backToCategory": backToCategory(); break;
      case "pickCounty": goToCounty(el.getAttribute("data-county")); break;
      case "submitZip": submitZip(); break;
      case "pickCategory": selectCategory(el.getAttribute("data-category")); break;
      case "openDetail": openDetail(el.getAttribute("data-id"), el.getAttribute("data-from")); break;
      case "toggleSave": e.stopPropagation(); toggleSave(el.getAttribute("data-id")); break;
      case "toggleFilters": toggleFilterPanel(); break;
      case "setGenderFilter": setGenderFilter(el.getAttribute("data-value") || null); break;
      case "setAgeFilter": setAgeFilter(el.getAttribute("data-value") || null); break;
      case "toggleHideSexOffense": toggleSexOffenseFilter(); break;
      case "clearFilters": clearFilters(); break;
      case "reloadData": loadResources(); break;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.getAttribute("data-role") === "zip-input") {
      zipHadFocus = true;
      var v = String(e.target.value || "").replace(/[^0-9]/g, "").slice(0, 5);
      state.zipValue = v;
      state.zipError = null;
      render();
    }
  });

  document.addEventListener("focusout", function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-role") === "zip-input") {
      zipHadFocus = false;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-role") === "zip-input" && e.key === "Enter") {
      submitZip();
    }
  });

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  function loadResources() {
    state.dataStatus = "loading";
    render();
    fetch("./resources.json", { cache: "no-store" })
      .then(function (resp) {
        if (!resp.ok) { throw new Error("HTTP " + resp.status); }
        return resp.json();
      })
      .then(function (data) {
        if (Array.isArray(data)) { ALL_RESOURCES = data; DATA_UPDATED = null; }
        else { ALL_RESOURCES = (data && data.resources) || []; DATA_UPDATED = (data && data.updated) || null; }
        state.dataStatus = "ready";
        render();
      })
      .catch(function (err) {
        state.dataStatus = "error";
        render();
      });
  }

  state.savedIds = loadSavedIds();
  loadResources();
})();
</script>
</body>
</html>
